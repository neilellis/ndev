# The layout of ssd-build on 2026-11-24: TathataSystems/fcc (four runners) and TathataSystems/analytics (two).
# Six supabase runners on 16 CPUs break the sizing rule; the owner chose this on purpose, so provision.sh needs --allow-oversubscribed.
name_prefix=ssd-build
port_base=21000
work_size=10G
tmp_size=3G
swap_size=16G
timezone=Europe/Berlin
supabase=yes
heavy_label=supabase
node_major=22
chrome=yes
cockpit=yes
packages=python3-pip python3-venv make pkg-config libssl-dev postgresql-client-16 redis-server sqlite3 shellcheck ripgrep tesseract-ocr poppler-utils tmux screen tcpdump zsh time numactl docker-ce-rootless-extras
services=redis-server
runner=1:TathataSystems/fcc:fcc,supabase
runner=2:TathataSystems/fcc:fcc,supabase
runner=3:TathataSystems/fcc:fcc,supabase
runner=4:TathataSystems/fcc:fcc,supabase
runner=5:TathataSystems/analytics:tathata-build,supabase:16G:4G
runner=6:TathataSystems/analytics:tathata-build,supabase:16G:4G
sweep_repo=TathataSystems/fcc
image=falkordb/falkordb-server:6.0.4
image=public.ecr.aws/supabase/postgres:17.11.0.006
image=public.ecr.aws/supabase/gotrue:v2.197.0
image=public.ecr.aws/supabase/postgrest:v16.5
image=public.ecr.aws/supabase/realtime:v2.147.1
image=public.ecr.aws/supabase/storage-api:v1.84.19
image=public.ecr.aws/supabase/postgres-meta:v0.100.0
image=public.ecr.aws/supabase/kong:2.8.1
image=public.ecr.aws/supabase/mailpit:v1.31.3
docker_sweep_project=^fcc-test-pg(-ci[0-9]+)?$
docker_sweep_project=^fcc-proto(-ci[0-9]+)?$
docker_sweep_keep=^fcc-test-pg-ci(1|2|3|4)$
docker_sweep_container=^fcc-falkordb-check-[0-9]+ 
docker_sweep_container=^graphdb-[0-9]+-[0-9]+ 
docker_sweep_container=^[0-9a-f]{32}_[^ ]* falkordb/falkordb-server
docker_sweep_image=^fcc-graphdb-[0-9]+-[0-9]+$
