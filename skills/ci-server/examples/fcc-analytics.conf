name_prefix = ssd-build
port_base = 21000
work_size = 10G
tmp_size = 3G
swap_size = 16G
timezone = Europe/Berlin
unit_prefix = fcc

runner = 1:TathataSystems/fcc:fcc,supabase
runner = 2:TathataSystems/fcc:fcc,supabase
runner = 3:TathataSystems/fcc:fcc,supabase
runner = 4:TathataSystems/fcc:fcc,supabase
runner = 5:TathataSystems/analytics:tathata-build,supabase:16G:4G
runner = 6:TathataSystems/analytics:tathata-build,supabase:16G:4G

heavy_label = supabase

apt_sources = github-cli,google-chrome,nodesource-22
packages = nodejs gh google-chrome-stable git-lfs python3 python3-pip python3-venv build-essential make pkg-config libssl-dev postgresql-client-16 redis-server sqlite3 shellcheck ripgrep tesseract-ocr poppler-utils rsync tmux screen htop zip unzip xz-utils strace tcpdump lsof psmisc zsh uuid-runtime time numactl mdadm
services = redis-server

env.SUPABASE_PROJECT_ID_SUFFIX = -ci{slot}
port.SUPABASE_SHADOW_PORT = 0
port.SUPABASE_API_PORT = 1
port.SUPABASE_DB_PORT = 2
port.SUPABASE_STUDIO_PORT = 3
port.SUPABASE_INBUCKET_PORT = 4
port.SUPABASE_SMTP_PORT = 5
port.SUPABASE_POP3_PORT = 6
port.SUPABASE_ANALYTICS_PORT = 7
port.SUPABASE_POOLER_PORT = 9
port.SUPABASE_EDGE_INSPECTOR_PORT = 83

sweep_repos = TathataSystems/fcc
docker_sweep_projects = ^(fcc-test-pg|fcc-proto)(-ci[0-9]+)?$
docker_sweep_keep = ^fcc-test-pg-ci({slots})$
docker_sweep_containers = ^(fcc-falkordb-check-[0-9]+|graphdb-[0-9]+-[0-9]+)$
docker_sweep_service_images = ^falkordb/falkordb-server
docker_sweep_images = ^fcc-graphdb-[0-9]+-[0-9]+$
prepull_images = fcc-ci-images.txt
