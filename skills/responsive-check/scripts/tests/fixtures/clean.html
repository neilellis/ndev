<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1a1a1a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111111; --fg: #f2f2f2; } }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { padding: 16px; max-width: 60rem; margin: 0 auto; }
  .cta { display: inline-block; min-height: 48px; min-width: 48px; padding: 12px 20px; }
  input { font-size: 16px; min-height: 48px; width: 100%; box-sizing: border-box; }
  img { max-width: 100%; height: auto; }
</style>
</head>
<body>
<main>
  <h1>A clean page</h1>
  <p>Text that wraps at every width, with an <a href="#inline">inline link</a> inside the sentence.</p>
  <button class="cta" type="button">Start</button>
  <label for="q">Search</label>
  <input id="q" type="text">
</main>
</body>
</html>
