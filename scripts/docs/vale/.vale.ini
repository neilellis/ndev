StylesPath = styles
MinAlertLevel = suggestion

# Markdown: skip fenced code, inline code, URLs, link targets — a plan is full of
# identifiers and none of them are prose — and QUOTED SPANS.
#
# A quotation is somebody else's words. You cannot rewrite it to satisfy a rule, so a
# rule that fires inside one has no fix available and teaches agents to ignore the
# linter. Measured 2026-08-10 while sweeping "should" out of the wiki: 15 of 122 hits
# were quoted — the maintainer's own instructions, a quoted council motion, a quoted product
# requirement. Every one had to stay exactly as written.
[*.md]
BasedOnStyles = House
TokenIgnores = (\x60[^\x60\n]+\x60), (\[[^\]]+\]\([^)]+\)), (https?://\S+), ("[^"\n]*")

# Plain text: PR/issue comment bodies written to a scratch file before posting.
[*.txt]
BasedOnStyles = House
TokenIgnores = (\x60[^\x60\n]+\x60), (https?://\S+)
