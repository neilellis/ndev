name: ndev checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d645899dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/ndev/workflow/check-plugin-version.mjs
      - run: npm test

  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d645899dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install the pinned SDK runtime
        run: |
          set -euo pipefail
          version="$(node -p "require('./scripts/test/sdk-runtime.json').version")"
          package="$(node -p "require('./scripts/test/sdk-runtime.json').package")"
          npm install --prefix "$RUNNER_TEMP/sdk-runtime" --no-audit --no-fund "$package@$version"
          echo "NDEV_SDK_CLAUDE=$RUNNER_TEMP/sdk-runtime/node_modules/.bin/claude" >> "$GITHUB_ENV"
      - run: node scripts/test/sdk.mjs
